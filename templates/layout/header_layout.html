<div class = "header-container">
  <div class = 'header-side left' onclick="history.back()">
    <img src = "{{url_for('static', filename='svg/arrow.svg')}}" alt="뒤로가기" class="back-arrow">
  </div>

  <div class = 'header-title'>
    <span>{{header_title if header_title else "투개더"}}</span>
  </div>

  <div class = 'header-side right'>
    <img src = "{{url_for('static', filename='svg/menu.svg')}}" alt="메뉴" class="menu-icon">
  </div>
  
</div>
