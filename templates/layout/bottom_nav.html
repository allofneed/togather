  <ul>
    <li class="list {% if request.endpoint == 'mypage' %}active{% endif %}">
      <a href="{{url_for('mypage')}}">
        <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
        <span class="text">마이페이지</span>
      </a>
    </li>

    <li class="list {% if request.endpoint == 'message' %}active{% endif %}">
      <a href="{{ url_for('message') }}">
        <span class="icon"><ion-icon name="chatbubble-outline"></ion-icon></span>
        <span class="text">메세지</span>
      </a>
    </li>

    <li class="list {% if request.endpoint == 'index' %}active{% endif %}">
      <a href="{{ url_for('index') }}">
        <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
        <span class="text">홈</span>
      </a>
    </li>

    <li class="list {% if request.endpoint == 'picture' %}active{% endif %}">

      </a>

      <a href="javascript:void(0);" onclick="openQRCamera()">

<div id="qr-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; flex-direction: column; align-items: center; justify-content: center;">
    
    <div style="width: 100%; max-width: 500px; padding: 20px; text-align: center;">
        <h3 style="color: white; margin-bottom: 20px;">매장 QR코드를 스캔해주세요</h3>
        
        <div id="qr-reader" style="width: 100%; border-radius: 16px; overflow: hidden; background: black;"></div>
        
        <button onclick="closeQRCamera()" style="margin-top: 30px; padding: 12px 30px; background: #ff6b6b; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold;">닫기</button>
    </div>
</div>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<script>
    let html5QrCode;

    // 🚀 카메라 켜기 함수
    function openQRCamera() {
        // 모달창 띄우기
        document.getElementById('qr-modal').style.display = 'flex';
        
        // 스캐너 준비
        html5QrCode = new Html5Qrcode("qr-reader");
        
        // 후면 카메라(environment) 켜기
        html5QrCode.start(
            { facingMode: "environment" }, 
            {
                fps: 10,    // 초당 프레임
                qrbox: { width: 250, height: 250 } // 인식 영역 크기 (네모 박스)
            },
            // ✅ QR코드를 성공적으로 읽었을 때 실행되는 곳!
            (decodedText, decodedResult) => {
                // 스캔 성공하면 삐- 소리 대신 카메라 끄고 해당 주소로 이동!
                html5QrCode.stop().then(() => {
                    // QR코드에 담긴 주소(예: https://togethriding.co.kr/store/10)로 즉시 이동합니다.
                    window.location.href = decodedText; 
                });
            },
            // 에러(스캔 중)는 무시해도 됨
            (errorMessage) => { }
        ).catch((err) => {
            alert("카메라 권한을 허용해주세요!");
            closeQRCamera();
        });
    }

    // 🛑 카메라 끄기 (닫기 버튼 눌렀을 때)
    function closeQRCamera() {
        document.getElementById('qr-modal').style.display = 'none';
        if (html5QrCode) {
            html5QrCode.stop().catch(err => console.error("카메라 끄기 실패", err));
        }
    }
</script>
